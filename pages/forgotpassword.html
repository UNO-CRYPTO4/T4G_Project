<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: #f5f2e9; /* warm cream */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .forgot-container {
      background: #fffef9;
      padding: 40px;
      border-radius: 12px;
      border: 2px solid #d4c5a5; /* subtle gold tone */
      box-shadow: 0 8px 20px rgba(44, 34, 22, 0.2);
      width: 380px;
      text-align: center;
    }

    .forgot-container h2 {
      margin-bottom: 15px;
      color: #2c2c2c;
      font-size: 22px;
      letter-spacing: 1px;
      border-bottom: 1px solid #d4c5a5;
      padding-bottom: 8px;
    }

    .forgot-container p {
      font-size: 14px;
      color: #4a4a4a;
      margin-bottom: 20px;
      font-style: italic;
    }

    .forgot-container input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #b5a27a;
      border-radius: 6px;
      background: #faf9f5;
      font-family: 'Georgia', serif;
      font-size: 14px;
    }

    .forgot-container button {
      width: 100%;
      padding: 12px;
      background: #2f3e46; /* deep luxury green/blue */
      color: #fdfdfd;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 0.5px;
      transition: background 0.3s ease;
    }

    .forgot-container button:hover {
      background: #1d262b;
    }

    #message {
      margin-top: 15px;
      font-size: 14px;
      color: #2f3e46;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="forgot-container">
    <h2>Forgot Password</h2>
    <p>Enter your email address and we’ll send you a reset link.</p>
    
    <form id="forgotForm">
      <input type="email" id="email" placeholder="Your email" required>
      <button type="submit">Send Reset Link</button>
    </form>
    
    <p id="message"></p>
  </div>

  <script>
    document.getElementById("forgotForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      document.getElementById("message").textContent = 
        `If ${email} is registered, a reset link has been sent.`;
    });
  </script>
</body>
</html>
